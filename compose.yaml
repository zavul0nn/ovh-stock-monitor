services:
  monitor:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      STATE_DB: /data/monitor.sqlite3
    volumes:
      - stock-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  stock-data:
